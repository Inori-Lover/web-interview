# 镜像源与依赖解析策略统一维护在工作区配置中。
registry: https://mirrors.tencent.com/npm/
resolutionMode: time-based
registrySupportsTimeField: true
engineStrict: true

overrides:
  # vue-tsc 使用经典 TypeScript 接口，类型检查由 tsgo 7.0.2 执行。
  typescript: npm:typescript-native-bridge@6.0.3-bridge.17.tsgo.7.0.2
  vue: 3.6.0-rc.14
  '@vue/shared': 3.6.0-rc.14
